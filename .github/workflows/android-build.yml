name: Android build

on:
  pull_request:
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-build.yml'
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-build.yml'

jobs:
  assemble-release:
    name: Assemble release (compile Kotlin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install platform and build-tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Write SDK path for Gradle
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Write google-services.json from secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "${GOOGLE_SERVICES_JSON}" ]; then
            echo "Error: GOOGLE_SERVICES_JSON repository secret is not set or empty."
            exit 1
          fi
          printf '%s\n' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Assemble release
        run: ./gradlew assembleRelease --no-daemon
