name: Next Task Agent

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      task_file:
        description: Path to task JSON under tasks/
        required: false
        default: tasks/multi-partner-support.json

permissions:
  contents: read

jobs:
  trigger-cursor-agent:
    name: Trigger Cursor Cloud Agent
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.AGENT_WORKFLOW_APP_ID }}
          private-key: ${{ secrets.AGENT_WORKFLOW_MANAGER_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Resolve task file path
        id: task-path
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "path=${{ inputs.task_file }}" >> "$GITHUB_OUTPUT"
          else
            echo "path=tasks/multi-partner-support.json" >> "$GITHUB_OUTPUT"
          fi

      - name: Select next PR and update task JSON
        id: select
        env:
          TASK_FILE: ${{ steps.task-path.outputs.path }}
        run: |
          set -euo pipefail
          if [ ! -f "$TASK_FILE" ]; then
            echo "Task file not found: $TASK_FILE"
            exit 1
          fi

          DECISION=$(jq -n --slurpfile t "$TASK_FILE" '
            def pr_by_id($prs; $id):
              ($prs | map(select(.id == $id)) | first);

            def is_completed($prs; $id):
              pr_by_id($prs; $id) as $p
              | $p != null and $p.status == "completed";

            def deps_met($prs; $deps):
              ($deps // []) | all(
                . as $d
                | if ($d | type) == "string" and ($d | test("^PR [0-9]+$")) then
                    ($d | ltrimstr("PR ") | tonumber) as $depid
                    | is_completed($prs; $depid)
                  else
                    true
                  end
              );

            def has_active($prs):
              any($prs[]; .started == true or .status == "in_progress");

            ($t[0]) as $root
            | ($root.pullRequests) as $prs
            | if has_active($prs) then
                {action: "skip", reason: "already_started_or_in_progress"}
              else
                ($prs
                  | to_entries
                  | map(select(.value.status != "completed" and deps_met($prs; .value.dependencies)))
                  | first) as $pick
                | if $pick == null then
                    {action: "skip", reason: "none_ready_or_all_complete"}
                  else
                    {
                      action: "start",
                      index: $pick.key,
                      pr: $pick.value
                    }
                  end
              end
          ')

          echo "$DECISION" | jq .
          ACTION=$(echo "$DECISION" | jq -r .action)

          if [ "$ACTION" != "start" ]; then
            echo "should_trigger=false" >> "$GITHUB_OUTPUT"
            echo "reason=$(echo "$DECISION" | jq -r .reason)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          INDEX=$(echo "$DECISION" | jq -r .index)
          jq --argjson idx "$INDEX" '
            .pullRequests[$idx].started = true
            | .pullRequests[$idx].status = "in_progress"
          ' "$TASK_FILE" > "$TASK_FILE.tmp"
          mv "$TASK_FILE.tmp" "$TASK_FILE"

          echo "should_trigger=true" >> "$GITHUB_OUTPUT"
          echo "index=$INDEX" >> "$GITHUB_OUTPUT"

      - name: Commit task status (mark PR started)
        if: steps.select.outputs.should_trigger == 'true'
        env:
          TASK_FILE: ${{ steps.task-path.outputs.path }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$TASK_FILE"
          if git diff --staged --quiet; then
            echo "No staged changes; aborting commit."
            exit 1
          fi
          git commit -m "chore(workflow): mark PR as started in task plan [skip ci]"
          git push -u origin HEAD:main

      - name: Build agent prompt
        if: steps.select.outputs.should_trigger == 'true'
        id: prompt
        env:
          TASK_FILE: ${{ steps.task-path.outputs.path }}
          PR_INDEX: ${{ steps.select.outputs.index }}
        run: |
          set -euo pipefail
          TEXT=$(.github/scripts/build-next-task-agent-prompt.sh "$TASK_FILE" "$PR_INDEX")
          {
            echo 'text<<PROMPT_EOF'
            echo "$TEXT"
            echo 'PROMPT_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Trigger Cursor Cloud Agent
        if: steps.select.outputs.should_trigger == 'true'
        env:
          CURSOR_AGENT_API_KEY: ${{ secrets.CURSOR_AGENT_API_KEY }}
          PROMPT_TEXT: ${{ steps.prompt.outputs.text }}
        run: |
          set -euo pipefail
          REPO_URL="https://github.com/${{ github.repository }}"
          REF_NAME="${{ github.ref_name }}"

          JSON_PAYLOAD=$(jq -n \
            --arg repo "$REPO_URL" \
            --arg ref "$REF_NAME" \
            --arg prompt "$PROMPT_TEXT" \
            '{
              "prompt": { "text": $prompt },
              "model": "default",
              "source": {
                "repository": $repo,
                "ref": $ref
              },
              "target": {
                "autoCreatePr": true
              }
            }'
          )

          HTTP_RESPONSE=$(curl --silent --show-error --write-out "HTTPSTATUS:%{http_code}" \
            --request POST \
            --url https://api.cursor.com/v0/agents \
            --header "Authorization: Bearer ${CURSOR_AGENT_API_KEY}" \
            --header 'Content-Type: application/json' \
            --data "$JSON_PAYLOAD")

          HTTP_BODY=$(echo "$HTTP_RESPONSE" | sed -E 's/HTTPSTATUS\:[0-9]{3}$//')
          HTTP_STATUS=$(echo "$HTTP_RESPONSE" | tr -d '\n' | sed -E 's/.*HTTPSTATUS:([0-9]{3})$/\1/')

          if [ "$HTTP_STATUS" -ne 200 ] && [ "$HTTP_STATUS" -ne 201 ]; then
            echo "Error: Failed to trigger agent (Status: $HTTP_STATUS)"
            echo "Response: $HTTP_BODY"
            exit 1
          fi

          echo "Successfully triggered agent!"
          echo "$HTTP_BODY" | jq .
